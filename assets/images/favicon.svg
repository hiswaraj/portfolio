<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="#07090e" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Glowing Gradient Badge Accent -->
  <rect x="4" y="4" width="56" height="56" rx="13" fill="url(#bgGrad)" filter="url(#glow)" opacity="0.95" />

  <!-- Monogram Logo "SM" -->
  <text x="32" y="41" 
        font-family="-apple-system, BlinkMacSystemFont, 'Poppins', 'Inter', sans-serif" 
        font-size="25" 
        font-weight="900" 
        letter-spacing="-1.2"
        fill="#ffffff" 
        text-anchor="middle">SM</text>
  
  <!-- Glowing Dot Accent -->
  <circle cx="49" cy="42" r="3" fill="#38bdf8" />
</svg>
